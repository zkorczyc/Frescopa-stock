# https://render.com — Web Service, Node
services:
  - type: web
    name: frescopa-mcp
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:http
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
